name: HRM CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: hrm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ruby_quality:
    name: Ruby / Rails lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL build headers
        run: sudo apt-get update -qq && sudo apt-get install -y default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: '2.6.9'
          bundler-cache: true
      - name: RuboCop - all engines, lint, Rails, security, performance and format
        run: |
          mkdir -p tmp
          bundle exec rubocop --format progress --format json --out tmp/rubocop.json
      - name: Enforce explicit routes and Module + MVC + CQRS boundaries
        run: |
          ruby bin/check-routes
          ruby bin/check-architecture
      - name: Validate GitHub Actions workflow
        run: docker run --rm -v "$PWD/.github/workflows:/work:ro" rhysd/actionlint:1.7.7 -color /work/ci.yml
      - name: Static types and negative contract probe
        run: ruby bin/typecheck --self-test
      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubocop-report
          path: tmp/rubocop.json
          if-no-files-found: ignore
          retention-days: 7
  verify:
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    name: MySQL tests / autoload / security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral CI secrets and isolated Docker stack
        run: ruby bin/setup-docker
      - name: Test real MySQL constraints, guards and business flows
        run: bin/test-docker
      - name: Internal event receiver tests
        run: docker compose run --rm event_sink python test_server.py
      - name: Verify dependency and Rails DSL RBI against test schema
        run: docker compose run --rm --no-deps -e RAILS_ENV=test web ruby bin/check-rbi
      - name: Scan publishable source for secrets (fully redacted)
        run: docker compose run --rm --no-deps web ruby bin/check-secrets --self-test
      - name: Fresh structure.sql with constraints and guards
        run: RAILS_ENV="test" ruby bin/verify-test-schema
      - name: Smoke canonical image without mounting source
        run: ruby bin/smoke-image
      - name: Rails autoload
        run: docker compose run --rm --no-deps web bundle exec rails zeitwerk:check
      - name: Brakeman - application and all engines
        run: docker compose run --rm --no-deps web bundle exec ruby bin/brakeman --no-pager
      - name: Dependency vulnerability audit - refresh advisories
        run: docker compose run --rm --no-deps web bundle exec bundler-audit check --update
      - name: Lockfile must remain unchanged
        run: git diff --exit-code -- Gemfile.lock
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes
